<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    /* ---------------------------------
       Base & Reset Styles
    --------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #ffffff;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --focus-ring: rgba(37, 99, 235, 0.2);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      line-height: 1.5;
    }

    /* ---------------------------------
       Centered Login Card
    --------------------------------- */
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
                  0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .login-header p {
      font-size: 0.925rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    /* ---------------------------------
       Form Elements
    --------------------------------- */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 46px;
      padding: 0 1rem;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Extra padding inside password field for the toggle button */
    .password-input {
      padding-right: 3rem !important;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3.5px var(--focus-ring);
    }

    /* Show / Hide Toggle Button */
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: transparent;
      border: none;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    /* Options row (Remember me & Forgot Password) */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: 0;
    }

    .checkbox-label input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .forgot-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* Blue Submit Button */
    .btn-login {
      width: 100%;
      height: 46px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Card Footer */
    .signup-prompt {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .signup-prompt a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }

    /* ---------------------------------
       Mobile Responsiveness
    --------------------------------- */
    @media (max-width: 480px) {
      .login-container {
        padding: 2rem 1.25rem;
        border-radius: 12px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="login-container">
    <div class="login-header">
      <h1>Welcome back</h1>
      <p>Please enter your details to sign in</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="name@example.com" 
            required 
          />
        </div>
      </div>

      <!-- Password Field with Show/Hide Toggle -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="password-input" 
            placeholder="Enter your password" 
            required 
          />
          <button 
            type="button" 
            id="togglePassword" 
            class="toggle-password" 
            aria-label="Show password"
          >
            <!-- Eye Icon (Visible by default) -->
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <!-- Eye-Off Icon (Hidden by default) -->
            <svg id="eyeOffIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" name="rememberMe" />
          <span>Remember me</span>
        </label>
        <a href="#forgot" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Blue Login Button -->
      <button type="submit" class="btn-login">Log In</button>
    </form>

    <!-- Sign Up Link -->
    <p class="signup-prompt">
      Don't have an account? <a href="#signup">Sign up</a>
    </p>
  </main>

  <script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const loginForm = document.getElementById('loginForm');

    // Toggle Password Visibility
    toggleButton.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      // Toggle icons and accessibility label
      eyeIcon.style.display = isPassword ? 'none' : 'block';
      eyeOffIcon.style.display = isPassword ? 'block' : 'none';
      toggleButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      
      // Keep focus on input for a smooth typing experience
      passwordInput.focus();
    });

    // Simple Form Submission Handler
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Logging in with: ${email}`);
    });
  </script>

</body>
</html>
